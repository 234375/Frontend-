<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramadan_Counter</title>
  <link rel="stylesheet" href="Remedan.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Play:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <h2>Time until Ramadan</h2>
    <div class="time-launch">

  <div class="time-box">
    <p id="days">00</p>
    <span>Days</span>
  </div>

  <div class="time-box">
    <p id="hours">00</p>
    <span>Hours</span>
  </div>

  <div class="time-box">
    <p id="minutes">00</p>
    <span>Minutes</span>
  </div>

  <div class="time-box">
    <p id="seconds">00</p>
    <span>Seconds</span>
  </div>

</div>
    <div><i>Ramadan is coming...</i></div>
    
  </div>

<script src="Remedan.js"></script>
</body>
</html>
