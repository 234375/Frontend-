<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Play:wght@400;700&display=swap" rel="stylesheet">
  <title>Snake Game</title>
  <link rel="stylesheet"  href="Game.css">
  </head>

<body>
  <div class="scores">
    <h1>Score: <span id="score">000</span></h1>
    <h1>High: <span id="highscore">000</span></h1>
  </div>
  <div class="game-boarder-1">
   <div id="logo"></div>
    <h1 id="instruction-text">Tap screen or arrows to start</h1>
    <div id="game-board"></div>
  </div>

  <div class="controls">
    <div class="control-row">
      <button class="arrow-btn" data-direction="up">▲</button>
    </div>
    <div class="control-row">
      <button class="arrow-btn" data-direction="left">◀</button>
      <button class="arrow-btn" data-direction="down">▼</button>
      <button class="arrow-btn" data-direction="right">▶</button>
    </div>
  </div>
  <script src="Game.js"></script>
  </body>
  </html>
